<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/pennypicker.svg" type="image/svg+xml" />
	<title>PennyPicker · Oracle-delta BPS orderbook for stablecoins</title>
	<meta name="description"
		content="PennyPicker: a BCH/stablecoin orderbook where limit orders are priced in basis points relative to the live oracle price. Experimental, running on BCH Chipnet." />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta property="og:title" content="PennyPicker · Oracle-delta BPS orderbook for stablecoins" />
	<meta property="og:url" content="https://pennypicker.pages.dev/" />
	<meta property="og:description"
		content="Limit orders priced in ±BPS against the live BCH/USD oracle, settled by Bitcoin Cash covenants. Experimental, on Chipnet." />
	<meta property="og:type" content="website" />
	<meta name="theme-color" content="#b4652b" />
	<link rel="manifest" href="/manifest.json" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
	<script async src="/qr-code.js"></script>
	<style>
		/* Painted before any script runs, so the first frame already matches the app. */
		html, body { margin: 0; background: #f6f4f1; }
		@media (prefers-color-scheme: dark) { html, body { background: #141210; } }
		*, *::before, *::after { box-sizing: border-box; }
	</style>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
